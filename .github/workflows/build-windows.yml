name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MinGW & Ninja
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: git mingw-w6
